/* the sheet is just the address bar now */
#sheet:not(.preview){height:auto!important;background:transparent;border-top:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#sheet:not(.preview) .handle{display:none!important}

#sheet.preview.full{height:90%}
#sheet.preview.drag .sbody,#sheet.preview.settling .sbody{overflow:hidden!important}

/* at half height the sheet stops just under the status line, so what comes
   after it is not left half-cut behind the pills — it belongs to the pulled-up
   sheet. It comes back the moment the handle is dragged. */
#sheet.preview .pvmore>*{transition:opacity .22s}

   running into it — at half height, where the cut lands mid-paragraph, and
   while scrolling at full height. */
#sheet.preview::after{content:"";position:absolute;left:0;right:0;bottom:0;height:104px;background:linear-gradient(180deg,rgba(11,15,23,0),rgba(11,15,23,.92) 46%);pointer-events:none;z-index:2;transition:opacity .22s}

#sheet.preview .addr{display:block!important;position:absolute;left:18px;bottom:28px;z-index:3;width:calc(100% - 36px);transform:none;transition:width .38s cubic-bezier(.2,.8,.2,1)}
#sheet.preview .addr.mini:not(.open){width:152px;cursor:pointer}
#sheet.preview .addr.solo{left:50%;transform:translateX(-50%)}  /* the station preview has no Start, so the pill keeps the middle */
#sheet.preview .pvgo{position:absolute;right:18px;bottom:28px;z-index:3;width:calc(100% - 198px);height:48px;padding:0;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:650;box-shadow:var(--shadow-2),inset 0 1px 0 rgba(255,255,255,.5);transition:opacity .22s}
#sheet.preview .pvgo .ico{display:inline-flex;line-height:1}#sheet.preview .pvgo .ico svg{display:block}
#sheet.preview.leaving{background:transparent;border-top-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;transition:background .3s,border-color .3s,box-shadow .3s,bottom .32s cubic-bezier(.2,.8,.2,1)}
#sheet.preview.leaving .pvgo{opacity:0;pointer-events:none}

.hit{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;animation:in .5s forwards;cursor:pointer}.hit:last-child{border:0}.hit .ic{width:38px;height:44px;border-radius:8px;background:linear-gradient(160deg,#1a2436,var(--bg-2));border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:var(--cyan);font-family:ui-monospace,Menlo,monospace}.hit .t{font-size:14px;font-weight:600}.hit .s{font-size:12px;color:var(--faint)}.hit .w{font-size:12px;color:var(--cyan-ink);margin-top:2px}.hit .chk{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(74,222,128,.45);background:rgba(74,222,128,.1);color:var(--green);font-size:16px;cursor:pointer;display:grid;place-items:center}.hit.off{opacity:.45!important}.hit.off .chk{color:var(--faint);border-color:var(--line);background:var(--glass)}
.mail{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:18px;font-size:13.5px;line-height:1.55}.mail p{margin:0 0 10px}.mail ul{margin:0 0 10px;padding-left:18px}.mail li{margin:3px 0}.mail h5{margin:14px 0 6px;font-size:13.5px;font-weight:700}.mail .hd{font-size:12px;color:var(--paper-muted);border-bottom:1px solid var(--paper-rule);padding-bottom:8px;margin-bottom:10px}.mail .hd b{color:var(--paper-ink)}
/* The To: line is a control: the owner on the roll, the demo inbox, or an address typed in. */
.mail .tol{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 5px}.mail .torow{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap}.mail .tosel,.mail .toin{font:500 12px/1.2 -apple-system,sans-serif;color:var(--paper-ink);background:#fff;border:1px solid var(--paper-edge);border-radius:8px;padding:5px 7px;max-width:100%}.mail .tosel{cursor:pointer}.mail .toin{flex:1;min-width:150px}.mail .toin:focus-visible,.mail .tosel:focus-visible{outline:2px solid var(--paper-ink);outline-offset:2px}.mail .toin::placeholder{color:var(--paper-muted)}
.mail .eph{position:relative;border-radius:10px;overflow:hidden;background:var(--paper-rule);margin:6px 0 10px}.eph:not(.on){min-height:132px}.eph .vgen{background:#eef1f5;color:#526070}.eph .vgen.bad{color:#b4414b}.mail .eph img{width:100%;height:auto;display:block}.mail .eopt{margin:0 0 14px}.mail .eopt b{display:block;font-size:13.5px;margin-bottom:3px}.mail .eopt p{margin:0;color:var(--paper-soft)}
/* the approved corrections on the dark screens — the record they were chosen on and the internal report */
.ropt{margin:8px 0 0}.ropt+.ropt{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}.ropt b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:4px}.card .ropt p{margin:0;color:var(--soft);font-size:13px;line-height:1.45}
.rph{position:relative;border-radius:12px;overflow:hidden;background:var(--bg-1);margin:0 0 10px}.rph:not(.on){min-height:150px}.rph img{width:100%;height:auto;display:block}
.card .rleft{margin:12px 0 0;font-size:12px;color:var(--faint)}
.mail .ctl-row{display:flex;justify-content:flex-end;gap:8px;margin:2px 0 8px}.mail .ctl{display:inline-flex;align-items:center;background:var(--bg-1);color:var(--cyan);border:1px solid rgba(53,224,255,.45);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.mail .slot.cta{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg-1);color:var(--ink);border:1px solid rgba(53,224,255,.45);border-radius:14px;margin:6px 0 12px;cursor:pointer}.mail .cta-ic{width:34px;height:34px;border-radius:10px;background:rgba(53,224,255,.12);border:1px solid rgba(53,224,255,.35);color:var(--cyan);display:grid;place-items:center;flex:none}.mail .cta-t{font-size:14px;font-weight:600;flex:1}.mail .cta-ch{color:var(--cyan);font-size:20px;font-weight:600}
.mail .eatts{display:grid;gap:6px;margin-bottom:10px}.mail .eatt{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--paper-rule);border-radius:10px;padding:8px 10px}.mail .eatt-ic{width:34px;height:38px;border-radius:6px;background:#fee2e2;color:#b91c1c;font:700 10px/38px ui-monospace,Menlo,monospace;text-align:center;flex:none}.mail .eatt b{display:block;font-size:13px}.mail .eatt span{font-size:11.5px;color:var(--paper-muted)}
.stale{display:flex;align-items:center;gap:10px;background:rgba(255,182,72,.1);border:1px solid rgba(255,182,72,.4);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:13px;color:var(--amber-ink)}.stale button{margin-left:auto;border:0;background:var(--amber);color:#1b1200;font:600 12px/1 -apple-system,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
/* documents: section renderer, drafting states, editable mail */
.dlist{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}.dlist li{margin:4px 0}
.cref{margin:8px 0;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.05)}.cref:last-child{border:0;padding-bottom:0}.cref .ct2{font-size:12px;color:var(--faint);margin-top:3px}.cref p{font-size:13px;margin:3px 0 0}
.chip.red{color:var(--red-ink);border-color:rgba(255,92,108,.45);background:rgba(255,92,108,.12)}
.stale.work{color:var(--cyan);background:rgba(53,224,255,.08);border-color:rgba(53,224,255,.4)}
.stale.bad{color:var(--red-ink);background:rgba(255,92,108,.1);border-color:rgba(255,92,108,.45);align-items:flex-start}.stale.bad button{background:var(--red);color:var(--on-accent)}
.stale.ok{color:var(--green-ink);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.45)}

.mail .msec{margin:0 0 10px}.mail .msec h4{display:flex;align-items:center;margin:14px 0 6px;font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--paper-ink)}
.mail .msec .st{grid-template-columns:120px 1fr;border-bottom-color:var(--paper-rule)}
.mail .msec .dlist,.mail .msec p,.mail .msec .ed{color:var(--paper-soft)}
.mail .edbtn{border-color:var(--paper-edge);background:#fff;color:var(--paper-muted)}
.mail .edcard.editing .edbtn.main{background:var(--paper-ink);color:#fff;border-color:var(--paper-ink)}
.mail .edcard.editing .ed{outline-color:rgba(27,35,48,.4);background:rgba(27,35,48,.05)}
.mail .ed:focus{outline-color:var(--paper-ink);background:rgba(27,35,48,.07)}
/* help */
.help{position:fixed;right:40px;top:40px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--soft);font:600 16px/1 -apple-system,sans-serif;cursor:pointer;z-index:99}.helpbox{position:fixed;right:40px;top:92px;width:360px;max-height:80vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:16px;z-index:99;font-size:13px;display:none}.helpbox.on{display:block}.helpbox h3{margin:0 0 2px;font-size:15px}.helpbox .pur{color:var(--faint);margin-bottom:10px}.helpbox table{width:100%;border-collapse:collapse}.helpbox td{padding:5px 6px 5px 0;vertical-align:top;border-top:1px solid rgba(255,255,255,.06)}.helpbox td:first-child{color:var(--ink);font-weight:600;width:34%}.helpbox td:nth-child(2){color:var(--cyan);width:22%;font-size:12px}.helpbox td:last-child{color:var(--soft)}.helpbox .edge{margin-top:10px;color:var(--faint);font-size:12px}
.fade{animation:in .4s forwards}
.wrap{position:absolute;inset:0;z-index:64;background:rgba(5,7,12,.82);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px;animation:in .3s}.wbox{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:26px;padding:26px 20px 20px;text-align:center}.wcheck{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.5);display:grid;place-items:center;font-size:32px;color:var(--green);box-shadow:var(--shadow-2);animation:pop .6s var(--ease)}@keyframes pop{from{transform:scale(.4);opacity:0}}.wt{font-size:20px;font-weight:700;letter-spacing:-.01em}.ws{font-size:13px;color:var(--faint);margin:4px 0 18px}.wdocs{text-align:left;margin-bottom:18px}.wdoc{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin:8px 0}.wdoc .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(53,224,255,.12);border:1px solid rgba(53,224,255,.35);color:var(--green);font-size:13px}.wdoc .dot.spin{color:var(--cyan)}.wdoc .dot.spin::after{content:"";width:10px;height:10px;border:2px solid var(--cyan);border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}.wdoc b{display:block;font-size:14px}.wdoc small{font-size:12px;color:var(--faint)}
#docs.reveal .docbtn{animation:glow 1.6s var(--ease)}@keyframes glow{0%{border-color:var(--cyan);background:rgba(53,224,255,.12)}100%{border-color:var(--line);background:var(--glass)}}
.metaf{display:flex;flex-wrap:wrap;gap:4px 14px;padding:14px 6px 0;font-size:11.5px;color:var(--faint);line-height:1.5}.metaf b{font-weight:600;color:var(--faint)}
.stage{grid-template-columns:1fr auto 1fr}.stage>.phone{grid-column:2}.rail{grid-column:1;justify-self:end;margin-right:40px;width:300px;max-height:868px;display:flex;flex-direction:column;gap:8px;overflow:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rail-h{font-size:12px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}.rail-h small{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint);font-size:12px;margin-top:3px}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:14px;padding:11px 12px;font:inherit;cursor:pointer;transition:border-color .2s,background .2s}.pbtn:hover{border-color:rgba(53,224,255,.5);background:rgba(53,224,255,.06)}.pbtn .k{width:26px;height:26px;border-radius:8px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--cyan);flex:none}.pbtn .t{font-size:14px;font-weight:600}.pbtn .h{font-size:11.5px;color:var(--faint)}.pbtn[disabled]{opacity:.45;cursor:not-allowed;color:var(--faint);pointer-events:none}.pbtn.running{border-color:var(--cyan);background:rgba(53,224,255,.1)}
.rail-tour{margin-top:6px}.pbtn.tour{justify-content:center;background:rgba(53,224,255,.12);border-color:rgba(53,224,255,.45)}.pbtn.stop{justify-content:center;color:var(--red-ink);border-color:rgba(255,92,108,.45);background:rgba(255,92,108,.1);margin-top:8px}
.cursor{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(53,224,255,.35);border:2px solid var(--cyan);box-shadow:0 0 18px var(--cyan);pointer-events:none;z-index:200;transform:translate(-50%,-50%);opacity:0;transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s cubic-bezier(.2,.8,.2,1),opacity .18s}.cursor.on{opacity:1}.cursor.press{animation:press .3s}
.cursor .ping{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--cyan);opacity:0;pointer-events:none}.cursor.pulse .ping{animation:cping .55s ease-out both}
@keyframes cping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.8);opacity:0}}@keyframes press{50%{transform:translate(-50%,-50%) scale(.6)}}
@media (max-width:1180px){.rail{display:none}}
/* mock keyboard */
.phone{--kb:0px}
.kbd{position:absolute;left:0;right:0;bottom:0;height:262px;background:var(--bg-key);border-top:1px solid rgba(255,255,255,.06);z-index:48;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:8px 3px 0;user-select:none;-webkit-user-select:none}
.kbd.on{transform:translateY(0)}
.kbd-rows{display:flex;flex-direction:column;gap:11px;flex:1}
.kbd-row{display:flex;justify-content:center;gap:6px;padding:0 3px}
.kbd-row.r1{padding:0 22px}
.kbd-k{flex:1;max-width:38px;height:42px;border-radius:6px;border:none;background:#6b6d75;color:#fff;font:400 21px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;box-shadow:0 1px 0 #0a0b0e;cursor:pointer;transition:background .08s}
.kbd-k:active{background:#9a9ca5}
.kbd-k.fn{max-width:48px;flex:1.3;background:#474950;font-size:15px}
.kbd-k.fn.on{background:#fff;color:#111}
.kbd-k.space{max-width:none;flex:5;font-size:15px}
.kbd-k.ret{max-width:92px;flex:2.2;background:#474950;font-size:15px}
.kbd-bar{height:34px;position:relative;flex:none}
.kbd-bar::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#fff;transform:translateX(-50%)}
/* lift the sheets, dialogs and scrolling views above the keyboard */
.phone.kb .sheet,.phone.kb .sheet2{bottom:var(--kb)}
.phone.kb .sheet{height:auto!important;max-height:calc(100% - var(--kb) - 90px)}
/* with the keyboard up the sheet hugs its content, so suggestions open upward over the map instead of under the keys */
.phone.kb .sheet .sbody{overflow:visible;display:flex;flex-direction:column;min-height:0}.phone.kb .sheet #plan{flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.phone.kb .sugg{top:auto;bottom:calc(100% + 10px);max-height:272px;border-radius:16px;box-shadow:0 -20px 50px rgba(0,0,0,.55);display:flex;flex-direction:column-reverse;justify-content:flex-start}.phone.kb .sugg div{flex:none}.phone.kb .sugg div[data-i]{border-bottom:0;border-top:1px solid rgba(255,255,255,.05)}.phone.kb .sugg .sgx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.phone.kb #view{padding-bottom:var(--kb)}/* A field inside the view — the notice's recipient — leaves the bar it is
   working towards behind the keyboard unless the bar rides up with it. */
.phone.kb .bottom{bottom:var(--kb)}
.phone.kb .confirm{align-items:flex-start;padding-top:70px}

/* ---- motion: one easing, unhurried ---- */
:root{--ease:cubic-bezier(.22,1,.36,1);--easeio:cubic-bezier(.65,0,.35,1)}
.screen{will-change:transform,opacity}
.leaving{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:45;animation:leaveFwd .5s var(--ease) forwards}.leaving.back{animation-name:leaveBack}
@keyframes leaveFwd{to{transform:translateX(-14%) scale(.98);opacity:0}}@keyframes leaveBack{to{transform:translateX(100%);opacity:.9}}
#app.entering-fwd{animation:enterFwd .52s var(--ease) both}#app.entering-back{animation:enterBack .52s var(--ease) both}
@keyframes enterFwd{from{transform:translateX(100%)}to{transform:none}}@keyframes enterBack{from{transform:translateX(-14%) scale(.98);opacity:0}to{transform:none;opacity:1}}
.sheet{transition:height .62s var(--ease),bottom .5s var(--ease)!important}.sheet.drag{transition:none!important}
.sheet2{transition:transform .62s var(--ease)!important}.sheet2.recede{transition:transform .6s var(--easeio),opacity .45s!important}
.preview .addr{transition:width .55s var(--ease)!important}
.card,.rsec{animation-duration:.6s!important;animation-timing-function:var(--ease)!important}
.confirm{animation:fadeIn .35s var(--ease)}.confirm.out{animation:fadeOut .3s var(--easeio) forwards}.confirm .cbox{animation:riseIn .5s var(--ease)}.confirm.out .cbox{animation:riseOut .3s var(--easeio) forwards}
.drawer .scrim{animation:fadeIn .35s var(--ease)}.drawer .pane{animation:slide .5s var(--ease)}.drawer.out .scrim{animation:fadeOut .3s forwards}.drawer.out .pane{animation:slideOut .3s var(--easeio) forwards}
.lb{animation:fadeIn .35s var(--ease)}.lb.out{animation:fadeOut .3s forwards}.wrap{animation:fadeIn .4s var(--ease)}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}@keyframes riseIn{from{transform:translateY(28px);opacity:0}}@keyframes riseOut{to{transform:translateY(28px);opacity:0}}@keyframes slideOut{to{transform:translateX(-100%)}}
.docbtn,.entry,.srow,.loc,.mi{transition:transform .25s var(--ease),border-color .25s,background .25s}.docbtn:active,.entry:active,.loc:active{transform:scale(.985)}
.btn{transition:transform var(--dur-press) var(--ease-out),opacity .3s,background .3s!important}.btn:active{transform:scale(.97)!important}
/* ---- cold start ---- */
#boot{position:absolute;inset:0;z-index:120;pointer-events:none;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .7s var(--easeio)}#boot.out{opacity:0;pointer-events:none}
.boot-mark{position:relative;width:88px;height:88px;margin-bottom:14px}.boot-mark i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(53,224,255,.55);animation:bootRing 2.4s var(--ease) infinite}.boot-mark i:nth-child(2){animation-delay:.5s}.boot-mark i:nth-child(3){inset:30px;border:2px solid var(--cyan);background:var(--bg-1);animation:bootCore 1.6s var(--ease) both}
@keyframes bootRing{0%{transform:scale(.35);opacity:0}30%{opacity:.9}100%{transform:scale(1.15);opacity:0}}@keyframes bootCore{from{transform:scale(.4);opacity:0}}
.boot-t{font:600 12px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--ink);animation:fadeUp .8s .2s var(--ease) both}.boot-s{font-size:12px;color:var(--faint);animation:fadeUp .8s .35s var(--ease) both}.boot-l{margin-top:14px;animation:fadeIn .6s var(--ease) both;transition:opacity .22s}#boot.bye .boot-l{opacity:0}.boot-l span{font:600 11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--cyan);transition:color .3s}#boot.ready .boot-l span{color:var(--green)}
/* the cold-start reticle: four corners, spinning, that land on HQ */
.bootret{position:absolute;z-index:121;pointer-events:none;--c:var(--cyan);--k:20px;width:156px;height:156px;left:50%;top:50%;margin:-78px 0 0 -78px;filter:drop-shadow(0 0 8px rgba(53,224,255,.45));animation:retSpin 1.6s cubic-bezier(.65,.05,.35,.95) infinite,fadeIn .6s var(--ease) both;transition:opacity .22s,filter .4s}
.bootret i{position:absolute;width:var(--k);height:var(--k);border:2px solid var(--c);transition:border-color .35s,width .8s var(--ease),height .8s var(--ease)}
.bootret i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.bootret i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.bootret i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.bootret i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.bootret.amber,.bootret.ready.amber{--c:var(--amber);filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
@keyframes retSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(.84)}100%{transform:rotate(360deg) scale(1)}}
.bootret.ready{--c:var(--green);filter:drop-shadow(0 0 8px rgba(74,222,128,.45))}
.bootret.snap{animation:none;transition:left .8s var(--ease),top .8s var(--ease),width .8s var(--ease),height .8s var(--ease),margin .8s var(--ease),transform .8s var(--ease),filter .8s,opacity .22s}
.phone.snapping .lfocus{opacity:0}.lfocus{transition:opacity .25s}.phone.snapping .lfocus i{animation:none}.phone.landed .lfocus i:not(.lock){animation:hqBreathe 3.6s ease-in-out 1.2s infinite}
.boot-sweep{position:absolute;left:0;right:0;top:-3px;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 24px 4px rgba(53,224,255,.55);animation:sweep 1.5s .1s var(--easeio) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.phone.booting #app{opacity:0}.phone.booted #app{animation:fadeIn .7s var(--ease) both}.phone.booted .sheet{animation:riseSheet .9s var(--ease) both}@keyframes riseSheet{from{transform:translateY(110%)}}
/* ---- merged UI ---- */
.uc{border:1px dashed rgba(53,224,255,.35);border-radius:16px;padding:18px 16px;text-align:center}.uc-ic{width:44px;height:44px;border-radius:14px;margin:0 auto 10px;background:var(--bg-1);border:1px solid rgba(53,224,255,.4);display:grid;place-items:center;color:var(--cyan)}.uc-t{font:600 12px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}.uc-s{font-size:13px;color:var(--faint);line-height:1.45}
